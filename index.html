<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WR Informático — Tarjeta</title>

<style>
  body {
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 330px;
    background: #c61616;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
  }

  .logo {
    font-size: 48px;
    font-weight: 900;
    color: #ffd52f;
    text-shadow: 0 0 12px #ffd52f;
  }

  .title {
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
  }

  .role {
    font-size: 14px;
    color: #ffe6a9;
    margin-bottom: 14px;
  }

  .item {
    font-size: 14px;
    margin-top: 4px;
  }

  .services {
    margin-top: 16px;
    text-align: left;
    background: rgba(0,0,0,0.25);
    padding: 12px;
    border-radius: 10px;
  }

  .services label {
    display: flex;
    align-items: center;
    font-size: 14px;
    margin-bottom: 6px;
    cursor: pointer;
    gap: 6px;
  }

  .services input {
    transform: scale(1.2);
  }

  .whatsapp-btn {
    margin-top: 16px;
    padding: 12px 18px;
    background: #25D366;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    border-radius: 6px;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 0 10px rgba(37, 211, 102, 0.6);
  }

  .whatsapp-btn:hover {
    background: #1EBE57;
  }
</style>
</head>

<body>

<div class="card">
  <div class="logo">WR</div>

  <div class="title">William Rivera</div>
  <div class="role">Técnico Informático</div>

  <div class="item">📞 +56 9 9875 4690</div>
  <div class="item">📧 r.williamxavier@gmail.com</div>
  <div class="item">📍 Curicó, Chile</div>

  <div class="services">
    <strong>Seleccione los servicios:</strong><br><br>

    <label><input type="checkbox" value="Reparación de PC o Notebook"> 🖥️ Reparación de PC o Notebook</label>
    <label><input type="checkbox" value="Instalación de Windows"> 💿 Instalación de Windows</label>
    <label><input type="checkbox" value="Optimización de rendimiento"> ⚡ Optimización de rendimiento</label>
    <label><input type="checkbox" value="Formateo"> 🔄 Formateo</label>
    <label><input type="checkbox" value="Respaldo de datos"> 💾 Respaldo de datos</label>
    <label><input type="checkbox" value="Diagnóstico remoto"> 🛰️ Diagnóstico remoto</label>
    <label><input type="checkbox" value="Limpieza interna de PC"> 🧹 Limpieza interna de PC</label>
    <label><input type="checkbox" value="Instalación de Office"> 📦 Instalación de Office</label>

  </div>

  <a id="whatsappBtn" class="whatsapp-btn" target="_blank">
    💬 Contactar por WhatsApp
  </a>
</div>

<script>
  const phone = "56998754690";

  document.getElementById("whatsappBtn").addEventListener("click", function(){

    const checks = document.querySelectorAll(".services input:checked");
    if (checks.length === 0) {
      alert("Seleccione al menos un servicio.");
      return;
    }

    let servicios = "";
    checks.forEach(c => servicios += "- " + c.value + "%0A");

    const mensaje = 
`Hola William,%0A
Necesito ayuda con:%0A
${servicios}%0A
Gracias.`;

    const url = "https://wa.me/" + phone + "?text=" + mensaje;

    window.open(url, "_blank");
  });
</script>

</body>
</html>

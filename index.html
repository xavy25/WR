<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WR Informático — Tarjeta</title>

<style>
  body {
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 330px;
    background: #c61616;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
  }

  .logo {
    font-size: 48px;
    font-weight: 900;
    color: #ffd52f;
    text-shadow: 0 0 12px #ffd52f;
  }

  .title {
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
  }

  .role {
    font-size: 14px;
    color: #ffe6a9;
    margin-bottom: 14px;
  }

  .item {
    font-size: 14px;
    margin-top: 4px;
  }

  .services {
    margin-top: 16px;
    text-align: left;
    background: rgba(0,0,0,0.25);
    padding: 12px;
    border-radius: 10px;
  }

  .services label {
    display: flex;
    align-items: center;
    font-size: 14px;
    margin-bottom: 6px;
    cursor: pointer;
    gap: 6px;
  }

  .services input {
    transform: scale(1.2);
  }

  .price-box {
    margin-top: 10px;
    background: rgba(0,0,0,0.35);
    padding: 10px;
    border-radius: 10px;
    display: none;
    text-align: left;
  }

  .total {
    margin-top: 10px;
    font-size: 18px;
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 8px;
    display: none;
  }

  .whatsapp-btn {
    margin-top: 16px;
    padding: 12px 18px;
    background: #25D366;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    border-radius: 6px;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 0 10px rgba(37, 211, 102, 0.6);
  }

  .whatsapp-btn:hover {
    background: #1EBE57;
  }
</style>
</head>

<body>

<div class="card">
  <div class="logo">WR</div>

  <div class="title">William Rivera</div>
  <div class="role">Técnico Informático</div>

  <div class="item">📞 +56 9 9875 4690</div>
  <div class="item">📧 r.williamxavier@gmail.com</div>
  <div class="item">📍 Curicó, Chile</div>

  <div class="services">
    <strong>Seleccione los servicios:</strong><br><br>

    <label><input type="checkbox" value="Reparación de PC o Notebook" data-price="15000"> 🖥️ Reparación de PC o Notebook</label>
    <label><input type="checkbox" value="Instalación de Windows" data-price="10000"> 💿 Instalación de Windows</label>
    <label><input type="checkbox" value="Optimización de rendimiento" data-price="8000"> ⚡ Optimización de rendimiento</label>
    <label><input type="checkbox" value="Formateo" data-price="12000"> 🔄 Formateo</label>
    <label><input type="checkbox" value="Respaldo de datos" data-price="15000"> 💾 Respaldo de datos</label>
    <label><input type="checkbox" value="Diagnóstico remoto" data-price="5000"> 🛰️ Diagnóstico remoto</label>
    <label><input type="checkbox" value="Limpieza interna de PC" data-price="12000"> 🧹 Limpieza interna de PC</label>
    <label><input type="checkbox" value="Instalación de Office" data-price="5000"> 📦 Instalación de Office</label>
  </div>

  <div id="priceBox" class="price-box"></div>

  <div id="totalBox" class="total"></div>

  <a id="whatsappBtn" class="whatsapp-btn" target="_blank">
    💬 Contactar por WhatsApp
  </a>
</div>

<script>
  const phone = "56998754690";
  const priceBox = document.getElementById("priceBox");
  const totalBox = document.getElementById("totalBox");
  const checks = document.querySelectorAll(".services input[type='checkbox']");

  function formatMoney(num) {
    return '$' + num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  // Mostrar precios + total dinámico
  checks.forEach(chk => {
    chk.addEventListener("change", () => {
      let html = "";
      let total = 0;
      const seleccionados = document.querySelectorAll(".services input:checked");

      if (seleccionados.length > 0) {
        seleccionados.forEach(s => {
          const price = parseInt(s.dataset.price);
          total += price;
          html += `<div>✔ ${s.value}: <b>${formatMoney(price)}</b></div>`;
        });

        priceBox.innerHTML = html;
        priceBox.style.display = "block";

        totalBox.innerHTML = `<b>Total estimado: ${formatMoney(total)}</b>`;
        totalBox.style.display = "block";

      } else {
        priceBox.style.display = "none";
        totalBox.style.display = "none";
      }
    });
  });

  // WhatsApp
  document.getElementById("whatsappBtn").addEventListener("click", function(){

    const seleccionados = document.querySelectorAll(".services input:checked");
    if (seleccionados.length === 0) {
      alert("Seleccione al menos un servicio.");
      return;
    }

    let servicios = "";
    let total = 0;

    seleccionados.forEach(s => {
      const price = parseInt(s.dataset.price);
      total += price;
      servicios += `- ${s.value} (${formatMoney(price)})%0A`;
    });

    const mensaje = 
`Hola William,%0A
Necesito ayuda con:%0A
${servicios}
Total estimado: ${formatMoney(total)}%0A
Gracias.`;

    const url = "https://wa.me/" + phone + "?text=" + mensaje;
    window.open(url, "_blank");
  });
</script>

</body>
</html>
